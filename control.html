<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREQ Producer Console</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07080a;color:#f7f8fb;font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}.hidden{display:none!important}
.loginShell{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,rgba(83,108,255,.12),transparent 38%)}
.login{width:min(430px,94vw);background:#101217;border:1px solid #292e38;border-radius:18px;padding:28px}
.brand{font-size:48px;font-weight:1000;letter-spacing:-4px}.brand i{font-style:normal;color:#536cff}
.tag{font-size:11px;letter-spacing:2px;color:#7185ff}.muted{color:#8f96a6;font-size:12px;line-height:1.5}
.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:10px;color:#9299aa;letter-spacing:1px}
.field input,.field select,.small{width:100%;background:#090a0e;border:1px solid #303541;border-radius:8px;color:white;padding:10px}
.primary,.ghost,.scene,.cue{cursor:pointer;border-radius:8px;font-weight:900}
.primary{border:0;background:#536cff;color:white;padding:11px 15px}
.ghost,.scene,.cue{border:1px solid #303541;background:#11141a;color:#fff;padding:10px 12px}
.login .primary{width:100%;margin-top:18px}.error{color:#ff8292;font-size:12px;min-height:16px;margin-top:10px}
.top{position:sticky;top:0;z-index:10;height:64px;background:#0a0b0f;border-bottom:1px solid #20242d;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.topL,.topR{display:flex;align-items:center;gap:10px}.mini{font-size:26px;font-weight:1000;letter-spacing:-3px}.mini i{font-style:normal;color:#536cff}
.layout{display:grid;grid-template-columns:245px 1fr}.side{border-right:1px solid #20242d;padding:15px;min-height:calc(100vh - 64px)}
.sideTitle{font-size:10px;color:#737b8c;letter-spacing:2px;margin:8px 0}.scene{width:100%;text-align:left;margin-bottom:7px;font-size:11px}.scene.on{border-color:#536cff;background:#171d31}
.main{padding:18px}.card{background:#0f1116;border:1px solid #252a34;border-radius:12px;margin-bottom:14px;overflow:hidden}
.head{padding:13px 15px;border-bottom:1px solid #252a34;display:flex;justify-content:space-between;align-items:center}.head h2{font-size:13px;margin:0}
.body{padding:15px}.switch{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.cueGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.timer{display:flex;justify-content:space-between;gap:15px;align-items:center}.readout{font-size:58px;letter-spacing:5px}.actions{display:flex;gap:7px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:50px 1.2fr 1.2fr 1fr 90px 86px;gap:7px;align-items:center;padding:8px;border:1px solid #262b35;border-radius:9px}
.judge{grid-template-columns:50px 1fr 100px}.rank{display:grid;grid-template-columns:70px 1fr 120px;gap:7px;margin-bottom:7px}
.status{font-size:10px;color:#7e8798}.live{color:#47d58a}.staged{color:#f1bd54}
@media(max-width:950px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #20242d}.switch{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.grid3{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.switch,.cueGrid{grid-template-columns:1fr 1fr}.timer{align-items:flex-start;flex-direction:column}.readout{font-size:42px}.topR a{display:none}}
</style>
</head>
<body>
<div id="loginShell" class="loginShell">
  <form id="loginForm" class="login">
    <div class="brand">FR<i>E</i>Q</div>
    <div class="tag">PRODUCER CONTROL</div>
    <h1>Sign in</h1>
    <p class="muted">Private broadcast control console.</p>
    <div class="field"><label>USERNAME</label><input id="user" value="admin" autocomplete="username"></div>
    <div class="field"><label>PASSWORD</label><input id="pass" type="password" autocomplete="current-password" required></div>
    <button class="primary" type="submit">SIGN IN</button>
    <div id="loginErr" class="error"></div>
  </form>
</div>

<div id="app" class="hidden">
<header class="top">
  <div class="topL"><div class="mini">FR<i>E</i>Q</div><span id="saveStatus" class="status live">LIVE</span></div>
  <div class="topR">
    <a class="ghost" style="text-decoration:none" href="./overlay.html" target="_blank" rel="noopener">OPEN OVERLAY</a>
    <button id="logout" class="ghost">SIGN OUT</button>
    <button id="push" class="primary">PUSH LIVE</button>
  </div>
</header>

<div class="layout">
<aside class="side">
  <div class="sideTitle">SCENES</div>
  <div id="sideScenes"></div>
  <div class="sideTitle" style="margin-top:18px">CUES</div>
  <button class="scene" data-cue="round_start">ROUND START</button>
  <button class="scene" data-cue="contestant">CONTESTANT STINGER</button>
  <button class="scene" data-cue="scores_locked">SCORES LOCKED</button>
  <button class="scene" data-cue="timeup">TIME'S UP</button>
  <button class="scene" data-cue="finals">FINALS</button>
</aside>

<main class="main">
<section class="card"><div class="head"><h2>LIVE SWITCHER</h2></div><div class="body"><div id="switcher" class="switch"></div></div></section>
<section class="card"><div class="head"><h2>ANIMATION CUES</h2></div><div class="body"><div class="cueGrid">
  <button class="cue" data-cue="round_start">ROUND START</button>
  <button class="cue" data-cue="contestant">CONTESTANT</button>
  <button class="cue" data-cue="scores_locked">SCORES LOCKED</button>
  <button class="cue" data-cue="timeup">TIME'S UP</button>
  <button class="cue" data-cue="finals">FINALS</button>
</div></div></section>
<section class="card"><div class="head"><h2>MASTER TIMER</h2><span id="timerState" class="muted">PAUSED</span></div><div class="body">
  <div class="timer"><div id="clock" class="readout">20:00</div><div class="actions">
    <button id="start" class="primary">START</button>
    <button id="pause" class="ghost">PAUSE</button>
    <button id="reset" class="ghost">RESET</button>
    <button id="minus" class="ghost">−30s</button>
    <button id="plus" class="ghost">+30s</button>
  </div></div>
</div></section>
<section class="card"><div class="head"><h2>SHOW INFO</h2></div><div id="showFields" class="body grid3"></div></section>
<section class="card"><div class="head"><h2>CONTESTANTS</h2></div><div id="contestants" class="body rows"></div></section>
<section class="card"><div class="head"><h2>JUDGES</h2></div><div id="judges" class="body rows"></div></section>
<section class="card"><div class="head"><h2>LEADERBOARD</h2><button id="sort" class="ghost">SORT FROM SCORES</button></div><div id="leaderboard" class="body"></div></section>
</main>
</div>
</div>

<script>
const API='https://ahidmhrotfetcxdwoxmn.supabase.co/functions/v1/freq-live';
const scenes=[['full','FULL SHOW'],['host','HOST'],['contestant1','CONTESTANT 1'],['contestant2','CONTESTANT 2'],['contestant3','CONTESTANT 3'],['contestant4','CONTESTANT 4'],['judges','JUDGES'],['scores','SCORES'],['upnext','UP NEXT'],['break','BREAK'],['finals','FINALS']];
let token=localStorage.getItem('freq_token')||'',live=null,draft=null;
const el=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x));

async function api(body){
  const h={'Content-Type':'application/json'};
  if(token) h.Authorization='Bearer '+token;
  const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({error:'Request failed'}));
  if(!r.ok) throw new Error(d.error||'Request failed');
  return d;
}
async function state(){
  const r=await fetch(API+'?api=state',{cache:'no-store'});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||'Could not load state');
  return d.state;
}
function get(p){return p.split('.').reduce((a,k)=>a&&a[k],draft)}
function setp(p,v){const a=p.split('.');let x=draft;for(let i=0;i<a.length-1;i++){x[a[i]]??={};x=x[a[i]]}x[a.at(-1)]=v;mark()}
function mark(){el('saveStatus').textContent='STAGED';el('saveStatus').className='status staged'}
function saved(){el('saveStatus').textContent='LIVE';el('saveStatus').className='status live'}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('"','&quot;')}
function field(l,p,t='text'){return '<div class="field"><label>'+l+'</label><input data-path="'+p+'" type="'+t+'" value="'+esc(get(p))+'"></div>'}
function effective(){const t=live?.timer||{};let r=Number(t.remainingSeconds||0);if(t.running&&t.startedAt)r-=Math.max(0,(Date.now()-new Date(t.startedAt).getTime())/1000);return Math.max(0,r)}
function tt(x){x=Math.max(0,Math.ceil(x));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}

function render(){
  if(!draft)return;
  const cur=live.scene||'full';
  el('sideScenes').innerHTML=scenes.map(x=>'<button class="scene '+(cur===x[0]?'on':'')+'" data-scene="'+x[0]+'">'+x[1]+'</button>').join('');
  el('switcher').innerHTML=scenes.map(x=>'<button class="scene '+(cur===x[0]?'on':'')+'" data-scene="'+x[0]+'">'+x[1]+'</button>').join('');
  el('showFields').innerHTML=
    field('EVENT TITLE','eventTitle')+field('SEASON','season')+field('PRESENTED BY','presentedBy')+
    field('ROUND','round')+field('PHASE','phase')+field('CHALLENGE','challengeTitle')+
    field('BPM','bpm','number')+field('KEY','key')+field('SAMPLE PACK','samplePack')+
    field('SAMPLE BY','sampleBy')+field('BRACKET','bracket');

  el('contestants').innerHTML=(draft.contestants||[]).map((c,i)=>
    '<div class="row"><span>#'+(i+1)+'</span>'+
    '<input class="small" data-ci="'+i+'" data-k="name" value="'+esc(c.name)+'">'+
    '<input class="small" data-ci="'+i+'" data-k="handle" value="'+esc(c.handle)+'">'+
    '<select class="small" data-ci="'+i+'" data-k="status">'+
      '<option '+(c.status==='IN PROGRESS'?'selected':'')+'>IN PROGRESS</option>'+
      '<option '+(c.status==='WAITING'?'selected':'')+'>WAITING</option>'+
      '<option '+(c.status==='DONE'?'selected':'')+'>DONE</option>'+
      '<option '+(c.status==='ELIMINATED'?'selected':'')+'>ELIMINATED</option>'+
    '</select>'+
    '<input class="small" type="number" step=".1" data-ci="'+i+'" data-k="score" value="'+(c.score??'')+'">'+
    '<button class="ghost" data-focus="'+(i+1)+'">FOCUS</button></div>'
  ).join('');

  el('judges').innerHTML=(draft.judges||[]).map((j,i)=>
    '<div class="row judge"><span>'+(i+1)+'</span>'+
    '<input class="small" data-ji="'+i+'" data-k="name" value="'+esc(j.name)+'">'+
    '<input class="small" type="number" step=".1" min="0" max="10" data-ji="'+i+'" data-k="score" value="'+(j.score??'')+'"></div>'
  ).join('');

  el('leaderboard').innerHTML=(draft.leaderboard||[]).map((x,i)=>
    '<div class="rank">'+
    '<input class="small" type="number" data-li="'+i+'" data-k="rank" value="'+(x.rank||i+1)+'">'+
    '<input class="small" data-li="'+i+'" data-k="name" value="'+esc(x.name)+'">'+
    '<input class="small" type="number" step=".1" data-li="'+i+'" data-k="score" value="'+(x.score??'')+'"></div>'
  ).join('');
  bind();
}

function bind(){
  document.querySelectorAll('[data-path]').forEach(n=>n.oninput=()=>setp(n.dataset.path,n.type==='number'&&n.value!==''?Number(n.value):n.value));
  document.querySelectorAll('[data-scene]').forEach(n=>n.onclick=()=>take(n.dataset.scene));
  document.querySelectorAll('[data-focus]').forEach(n=>n.onclick=()=>focus(Number(n.dataset.focus)));
  document.querySelectorAll('[data-ci]').forEach(n=>n.oninput=()=>{draft.contestants[+n.dataset.ci][n.dataset.k]=n.type==='number'?(n.value===''?null:+n.value):n.value;mark()});
  document.querySelectorAll('[data-ji]').forEach(n=>n.oninput=()=>{draft.judges[+n.dataset.ji][n.dataset.k]=n.type==='number'?(n.value===''?null:+n.value):n.value;mark()});
  document.querySelectorAll('[data-li]').forEach(n=>n.oninput=()=>{draft.leaderboard[+n.dataset.li][n.dataset.k]=n.type==='number'?(n.value===''?null:+n.value):n.value;mark()});
}

async function push(s=draft){await api({action:'update',state:s});live=clone(s);draft=clone(s);saved();render()}
async function take(sc){const s=clone(live);s.scene=sc;if(sc.startsWith('contestant'))s.activeContestant=+sc.replace('contestant','')||1;await push(s)}
async function focus(i){const s=clone(live);s.scene='contestant'+i;s.activeContestant=i;s.cue={type:'contestant',nonce:Number(s.cue?.nonce||0)+1};await push(s)}
async function cue(t){const s=clone(live);s.cue={type:t,nonce:Number(s.cue?.nonce||0)+1};await push(s)}
async function timer(a){
  const s=clone(live),t=s.timer||{durationSeconds:1200,remainingSeconds:1200,running:false,startedAt:null},r=effective();
  if(a==='start'&&!t.running){t.remainingSeconds=r;t.startedAt=new Date().toISOString();t.running=true}
  else if(a==='pause'){t.remainingSeconds=r;t.startedAt=null;t.running=false}
  else if(a==='reset'){t.durationSeconds=1200;t.remainingSeconds=1200;t.startedAt=null;t.running=false}
  else if(a==='plus'){t.remainingSeconds=r+30;t.startedAt=t.running?new Date().toISOString():null}
  else if(a==='minus'){t.remainingSeconds=Math.max(0,r-30);t.startedAt=t.running?new Date().toISOString():null}
  s.timer=t;await push(s)
}
function tick(){if(!live)return;el('clock').textContent=tt(effective());el('timerState').textContent=live.timer?.running?'RUNNING':'PAUSED'}

el('loginForm').onsubmit=async e=>{
  e.preventDefault();el('loginErr').textContent='';
  try{
    const d=await api({action:'login',username:el('user').value,password:el('pass').value});
    token=d.token;localStorage.setItem('freq_token',token);
    live=await state();draft=clone(live);
    el('loginShell').classList.add('hidden');el('app').classList.remove('hidden');render();saved();
  }catch(x){el('loginErr').textContent=x.message}
};
el('logout').onclick=async()=>{try{await api({action:'logout'})}catch{}localStorage.removeItem('freq_token');location.reload()};
el('push').onclick=()=>push().catch(e=>alert(e.message));
el('start').onclick=()=>timer('start');el('pause').onclick=()=>timer('pause');el('reset').onclick=()=>timer('reset');el('minus').onclick=()=>timer('minus');el('plus').onclick=()=>timer('plus');
document.querySelectorAll('[data-cue]').forEach(n=>n.onclick=()=>cue(n.dataset.cue));
el('sort').onclick=()=>{draft.leaderboard=(draft.contestants||[]).filter(x=>x.score!=null).slice().sort((a,b)=>b.score-a.score).map((x,i)=>({rank:i+1,name:x.name,score:+x.score}));mark();render()};
setInterval(tick,200);

(async()=>{
  if(!token)return;
  try{
    await api({action:'verify'});
    live=await state();draft=clone(live);
    el('loginShell').classList.add('hidden');el('app').classList.remove('hidden');render();saved();
  }catch{localStorage.removeItem('freq_token')}
})();
</script>
</body>
</html>
