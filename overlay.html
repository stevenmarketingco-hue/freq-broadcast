<script>
const API='https://ahidmhrotfetcxdwoxmn.supabase.co/functions/v1/freq-live?api=state';

let state=null,lastCue=0,lastScene='',lastSignature='';const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;');
const attr=v=>String(v??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','');
const bg=p=>p?.image?'style="background-image:url(\''+String(p.image).replaceAll("'","")+'\')"':'';
function normalizeCamUrl(raw){
  let u=String(raw||'').trim();
  if(!/^https:\/\//i.test(u))return '';
  try{
    const x=new URL(u);
    if(x.hostname==='vdo.ninja'||x.hostname.endsWith('.vdo.ninja')){
      const add=p=>{if(!new RegExp('[?&]'+p+'(?:[=&]|$)','i').test(u))u+=(u.includes('?')?'&':'?')+p};
      add('cleanoutput');add('transparent');add('autoplay');add('noaudio');
    }
  }catch(e){return ''}
  return u
}
function cam(p){
  const u=normalizeCamUrl(p?.camUrl);
  if(!u)return '';
  return '<iframe class="camFrame" src="'+attr(u)+'" allow="autoplay; camera; microphone; fullscreen; picture-in-picture" allowtransparency="true" scrolling="no" tabindex="-1"></iframe><span class="camBadge">LIVE CAM</span>';
}
function photoMedia(p,extra=''){return '<div class="photo mediaBox '+extra+'" '+bg(p)+'>'+cam(p)+'</div>'}
function heroMedia(p){
  const liveCam=cam(p);
  return '<div class="heroPhoto" '+bg(p)+'></div>'+(liveCam?'<div class="heroCamLayer">'+liveCam+'</div>':'')
}

function timer(s){const t=s.timer||{};let r=Number(t.remainingSeconds||0);if(t.running&&t.startedAt)r-=Math.max(0,(Date.now()-new Date(t.startedAt).getTime())/1000);r=Math.max(0,Math.ceil(r));return String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0')}
function upTimer(s){
  const u=s.upNext||{};let r=Number(u.remainingSeconds??u.durationSeconds??u.countdown??0);
  if(u.running&&u.startedAt)r-=Math.max(0,(Date.now()-new Date(u.startedAt).getTime())/1000);
  r=Math.max(0,Math.ceil(r));return String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0')
}
function header(s){return '<div class="top"><div class="logo">FR<i>E</i>Q</div><div class="round"><b>'+esc(s.round)+'</b><span>|</span><span>'+esc(s.phase)+'</span></div><div class="present">PRESENTED BY <strong>'+esc(s.presentedBy)+'</strong></div></div>'}
function full(s){const cs=s.contestants||[],js=s.judges||[],lb=s.leaderboard||[],chat=s.chat||[];return '<div class="grid"><section class="panel host"><div class="title"><span>HOST</span></div>'+photoMedia(s.host)+'<div class="meta"><b>'+esc(s.host?.name)+'</b><div class="muted">'+esc(s.host?.handle)+'</div></div></section><section class="panel challenge"><div class="muted">CHALLENGE</div><h1>'+esc(s.challengeTitle)+'</h1><p>'+esc(s.challengeDescription)+'</p><div class="metrics"><div class="metric"><small>BPM</small><strong>'+esc(s.bpm)+'</strong></div><div class="metric"><small>KEY</small><strong>'+esc(s.key)+'</strong></div><div class="metric"><small>TIME</small><strong data-time>'+timer(s)+'</strong></div></div></section><section class="panel contestants"><div class="title"><span>CONTESTANTS</span></div><div class="cards">'+cs.slice(0,4).map(c=>'<div class="c">'+photoMedia(c)+'<div class="meta"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.handle)+'</div><div class="status">'+esc(c.status)+'</div></div></div>').join('')+'</div></section><section class="panel judges"><div class="title"><span>JUDGES</span></div><div class="judgeGrid">'+js.slice(0,4).map((j,i)=>'<div class="j">'+photoMedia(j)+'<div class="score" data-judge-score="'+i+'">'+(j.score==null?'--':Number(j.score).toFixed(1))+'</div><div class="jname">'+esc(j.name)+'</div></div>').join('')+'</div></section><section class="side"><div class="panel up"><div class="title">UP NEXT</div><h2>'+esc(s.upNext?.name||'TBD')+'</h2><div class="muted">'+esc(s.upNext?.handle||'')+'</div><div class="bigtime" style="font-size:30px" data-upnext>'+upTimer(s)+'</div></div><div class="panel chat"><div class="title">LIVE CHAT</div>'+chat.slice(0,7).map(x=>'<div class="chatrow"><b>'+esc(x.user)+'</b>'+esc(x.message)+'</div>').join('')+'</div></section><section class="panel bottom"><div class="title">LEADERBOARD</div><div class="lb">'+lb.slice(0,5).map(x=>'<span>'+esc(x.rank)+'</span><span>'+esc(x.name)+'</span><span>'+(x.score==null?'--':Number(x.score).toFixed(1))+'</span>').join('')+'</div></section></div>'}
function personFocus(s,p,label){
  const hasCam=!!normalizeCamUrl(p?.camUrl);
  return '<div class="focus"><div class="panel hero">'+heroMedia(p)+'<div class="heroCopy"><div class="eyebrow">'+esc(label)+'</div><h1>'+esc(p?.name||'TBD')+'</h1><div class="muted">'+esc(p?.handle||'')+'</div>'+(hasCam?'':'<div class="muted" style="margin-top:10px">NO SOLO CAMERA URL SET</div>')+'</div></div><div class="panel info"><div class="muted">'+esc(s.challengeTitle)+'</div><div class="bigtime" data-time>'+timer(s)+'</div><p>'+esc(s.challengeDescription)+'</p></div></div>'
}

function introScene(s){
  const i=s.intro||{},title=esc(i.title||'STREAM STARTING SOON'),parts=title.split(' ');
  const first=parts.shift()||'STREAM',rest=parts.join(' ')||'STARTING SOON';
  return '<div class="introScene"><div class="introCorners"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span></div><div class="introCore"><div class="introKicker">'+esc(i.kicker||'LIVE BROADCAST')+'</div><div class="introLogo">FR<i>E</i>Q</div><div class="introRule"></div><h1 class="introHeadline">'+first+'<span>'+rest+'</span></h1><div class="introSub">'+esc(i.subtitle||'FREQ PRODUCER CHAMPIONSHIP')+'</div><div class="introDetail"><span class="introPulse"></span>'+esc(i.detail||'TOP 8 BATTLES • SEASON 1')+'</div></div></div>'
}

function hostScene(s){return personFocus(s,s.host||{},'HOST')}
function contestantScene(s){const i=Math.max(0,Number(s.activeContestant||1)-1),p=(s.contestants||[])[i]||{};return personFocus(s,p,'NOW LIVE')}
function judgesScene(s){const js=s.judges||[];return '<div class="judgesScene"><div class="judgesHero"><div><div class="muted">OFFICIAL PANEL</div><h1>JUDGES</h1></div><div class="muted">'+esc(s.round||'')+' • '+esc(s.phase||'')+'</div></div><div class="judgesCards">'+js.slice(0,4).map((j,i)=>'<div class="judgeCard panel">'+photoMedia(j)+'<div class="judgeScoreBig" data-judge-score="'+i+'">'+(j.score==null?'--':Number(j.score).toFixed(1))+'</div><div class="meta"><b>'+esc(j.name)+'</b><div class="muted">JUDGE</div></div></div>').join('')+'</div></div>'}

function scEmbedUrl(url){
  if(!/^https:\/\/(www\.)?soundcloud\.com\//i.test(String(url||'')))return '';
  return 'https://w.soundcloud.com/player/?url='+encodeURIComponent(url)+'&auto_play=false&show_artwork=false&show_comments=false&show_user=true&show_playcount=false&sharing=false&download=false&buying=false&color=%23536cff';
}
function listeningScene(s){
  const L=s.listening||{}, js=(s.judges||[]).slice(0,4), host=s.host||{}, sc=scEmbedUrl(L.soundcloudUrl);
  const player=sc?'<div class="scDeck"><div class="scWidgetWrap"><iframe id="scPlayer" allow="autoplay" scrolling="no" src="'+attr(sc)+'"></iframe></div><div class="scClock"><div><div id="scPlaybackState" class="state">LOADING TRACK</div><div class="time"><span id="scElapsed">00:00</span> / <span id="scDuration">00:00</span></div><div class="scProgress"><i id="scProgressFill"></i></div></div></div></div>':'<div class="reactionBar"><div class="label">SOUNDCLOUD</div><div class="muted">Paste a SoundCloud track link in the producer console.</div></div>';
  return '<div class="listeningScene">'+
    '<div class="listenTop">'+
      '<div><div class="k">'+esc(L.kicker||'NOW LISTENING')+'</div><h1>'+esc(L.title||'TRACK REVIEW')+'</h1><div class="sub">'+esc(L.subtitle||'HOST + JUDGES')+'</div><div id="listenArtist" class="artistLive">'+esc(L.artistName||L.producerName||'CURRENT PRODUCER')+'</div></div>'+
      '<div class="trackMeta"><div class="pill">'+esc(s.round||'ROUND')+' • '+esc(s.phase||'PHASE')+'</div><div class="producer">'+esc(L.artistName||L.producerName||'CURRENT PRODUCER')+'</div><div id="listenTrackTitle" class="track">'+esc(L.trackTitle||'UNTITLED DEMO')+'</div></div>'+
    '</div>'+
    '<div class="listenMid">'+
      '<div class="panel hero listenHost">'+heroMedia(host)+'<div class="heroCopy"><div class="eyebrow">HOST</div><h1>'+esc(host.name||'HOST')+'</h1><div class="muted">'+esc(host.handle||'')+'</div></div></div>'+
      '<div class="judgesStack">'+js.map((j,i)=>'<div class="listenJudge">'+photoMedia(j)+'<div class="judgeScoreBig" data-judge-score="'+i+'">'+(j.score==null?'--':Number(j.score).toFixed(1))+'</div><div class="meta"><b>'+esc(j.name)+'</b><div class="muted">JUDGE</div></div></div>').join('')+'</div>'+
    '</div>'+
    '<div class="listenBottom"><div>'+player+'</div><div class="listenDetail"><div>'+esc(L.detail||'LIVE JUDGE REACTIONS')+'</div><div id="listenEq" class="eq paused" style="margin-top:12px"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div></div>'+
  '</div>'
}

function scoreRevealScene(s){
  const i=Math.max(0,Number(s.activeContestant||1)-1),p=(s.contestants||[])[i]||{},js=s.judges||[];
  const score=p.score==null?'--':Number(p.score).toFixed(1);
  return '<div class="scoreRevealScene"><div class="panel hero scoreHero">'+heroMedia(p)+'<div class="heroCopy"><div class="eyebrow">OFFICIAL SCORE</div><h1>'+esc(p.name||'TBD')+'</h1><div class="muted">'+esc(p.handle||'')+'</div></div></div><div class="panel scoreNumberPanel"><div class="label">SCORE REVEAL</div><div class="scoreNumber">'+score+'<small> PTS</small></div><div class="judgeMiniScores">'+js.slice(0,4).map((j,i)=>'<div class="judgeMiniScore"><b>'+esc(j.name||'JUDGE')+'</b><span data-judge-score="'+i+'">'+(j.score==null?'--':Number(j.score).toFixed(1))+'</span></div>').join('')+'</div></div></div>'
}
function bracketScene(s){
  const b=s.bracketData||{},q=(b.qf||[]).slice(0,8),sf=(b.sf||[]).slice(0,4),f=(b.final||[]).slice(0,2);
  while(q.length<8)q.push('TBD');while(sf.length<4)sf.push('TBD');while(f.length<2)f.push('TBD');
  const pair=(arr,i)=>'<div class="match"><div>'+esc(arr[i]||'TBD')+'</div><div>'+esc(arr[i+1]||'TBD')+'</div></div>';
  return '<div class="bracketScene"><div class="bracketHead"><div><div class="sub">'+esc(b.subtitle||s.bracket||'TOP 8')+'</div><h1>'+esc(b.title||'CHAMPIONSHIP BRACKET')+'</h1></div><div class="muted">'+esc(s.round||'')+' • '+esc(s.phase||'')+'</div></div><div class="bracketGrid"><div class="bracketCol"><h3>QUARTERFINALS</h3>'+pair(q,0)+pair(q,2)+pair(q,4)+pair(q,6)+'</div><div class="bracketCol"><h3>SEMIFINALS</h3>'+pair(sf,0)+pair(sf,2)+'</div><div class="bracketCol"><h3>FINALS</h3>'+pair(f,0)+'</div><div class="championBox"><div class="tiny">CHAMPION</div><h2>'+esc(b.champion||s.winner?.name||'TBD')+'</h2></div></div></div>'
}
function winnerScene(s){
  const w=s.winner||{},p={name:w.name,handle:w.handle,image:w.image,camUrl:w.camUrl},score=w.score==null?'--':Number(w.score).toFixed(1);
  const confetti=Array.from({length:22},(_,i)=>'<i style="left:'+((i*47)%100)+'%;animation-delay:-'+((i*0.31)%5).toFixed(2)+'s"></i>').join('');
  return '<div class="winnerScene"><div class="confetti">'+confetti+'</div><div class="panel hero winnerHero">'+heroMedia(p)+'<div class="heroCopy"><div class="eyebrow">CHAMPION</div><h1>'+esc(w.name||'WINNER')+'</h1><div class="muted">'+esc(w.handle||'')+'</div></div></div><div class="panel winnerCopy"><div class="k">FREQ PRODUCER CHAMPIONSHIP</div><h1>'+esc(w.name||'WINNER')+'</h1><div class="sub">'+esc(w.subtitle||'FREQ PRODUCER CHAMPION')+'</div><div class="scoreWin">'+score+' <span style="font-size:20px">PTS</span></div></div></div>'
}
function scores(s){return '<div class="center"><div class="panel results"><div class="muted">OFFICIAL RESULTS</div><h1>LEADERBOARD</h1>'+(s.leaderboard||[]).map(x=>'<div class="rrow"><span>#'+esc(x.rank)+'</span><span>'+esc(x.name)+'</span><span class="pts">'+(x.score==null?'--':Number(x.score).toFixed(1))+'</span></div>').join('')+'</div></div>'}
function upnext(s){return '<div class="upNextScene"><div class="panel upNextCard"><div class="muted">UP NEXT</div><div style="width:320px;height:180px;margin:0 auto 22px;border-radius:10px;overflow:hidden;position:relative">'+photoMedia(s.upNext)+'</div><h1>'+esc(s.upNext?.name||'TBD')+'</h1><div class="muted">'+esc(s.upNext?.handle||'')+'</div><div class="count" data-upnext>'+upTimer(s)+'</div></div></div>'}
function special(s,t){return '<div class="center"><div class="special"><div class="logo">FR<i>E</i>Q</div><h1>'+t+'</h1><div class="muted">'+(t==='FINALS'?'THE LAST FLIP':'FREQ PRODUCER CHAMPIONSHIP')+'</div></div></div>'}
function sceneHTML(s,sc){if(sc==='intro')return introScene(s);if(sc==='full')return full(s);if(sc==='listening')return listeningScene(s);if(sc==='host')return hostScene(s);if(sc.startsWith('contestant'))return contestantScene(s);if(sc==='judges')return judgesScene(s);if(sc==='score_reveal')return scoreRevealScene(s);if(sc==='scores')return scores(s);if(sc==='bracket')return bracketScene(s);if(sc==='winner')return winnerScene(s);if(sc==='upnext')return upnext(s);if(sc==='break')return special(s,'WE’LL BE RIGHT BACK');if(sc==='finals')return special(s,'FINALS');return full(s)}
function signature(s){
  const x=JSON.parse(JSON.stringify(s));
  delete x.cue;delete x.lowerThird;delete x.timer;delete x.scene;
  if(x.listening)delete x.listening.playerCommand;
  if(Array.isArray(x.judges))x.judges=x.judges.map(j=>{const y={...j};delete y.score;return y});
  return JSON.stringify(x)
}
function updateJudgeScores(s){
  (s.judges||[]).forEach((j,i)=>{
    const text=j.score==null?'--':Number(j.score).toFixed(1);
    document.querySelectorAll('[data-judge-score="'+i+'"]').forEach(n=>n.textContent=text)
  })
}
function renderLowerThird(s){const lt=s.lowerThird||{},n=document.getElementById('lowerThird');document.getElementById('lowerTitle').textContent=lt.title||'';document.getElementById('lowerSub').textContent=lt.subtitle||'';n.classList.toggle('show',!!lt.visible)}

let scWidget=null,scReady=false,scDurationMs=0,lastScCommandNonce=0,pendingScCommand=null;
function msText(ms){let sec=Math.max(0,Math.floor(Number(ms||0)/1000));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function setScTime(pos,dur){
  const a=document.getElementById('scElapsed'),b=document.getElementById('scDuration'),f=document.getElementById('scProgressFill');
  if(a)a.textContent=msText(pos);if(b)b.textContent=msText(dur);
  if(f)f.style.width=(dur>0?Math.max(0,Math.min(100,pos/dur*100)):0)+'%'
}
function setScPlaying(on){
  const st=document.getElementById('scPlaybackState'),eq=document.getElementById('listenEq');
  if(st)st.textContent=on?'PLAYING':'PAUSED';
  if(eq)eq.classList.toggle('paused',!on)
}
function scArtist(sound){
  return sound?.publisher_metadata?.artist||sound?.artist_name||sound?.user?.username||sound?.user?.full_name||''
}
function setupSoundCloud(s){
  scWidget=null;scReady=false;scDurationMs=0;
  const frame=document.getElementById('scPlayer');
  if(!frame||!window.SC||!SC.Widget)return;
  try{
    scWidget=SC.Widget(frame);
    scWidget.bind(SC.Widget.Events.READY,()=>{
      scReady=true;
      try{scWidget.setVolume(Math.max(0,Math.min(100,Number(s.listening?.volume??82))))}catch(e){}
      scWidget.getDuration(d=>{scDurationMs=Number(d||0);setScTime(0,scDurationMs)});
      scWidget.getCurrentSound(sound=>{
        const artist=scArtist(sound),title=sound?.title||'';
        const a=document.getElementById('listenArtist'),t=document.getElementById('listenTrackTitle');
        if(a&&artist)a.textContent=artist;if(t&&title)t.textContent=title
      });
      scWidget.isPaused(p=>setScPlaying(!p));
      if(pendingScCommand){executeScCommand(pendingScCommand,s);pendingScCommand=null}
    });
    scWidget.bind(SC.Widget.Events.PLAY_PROGRESS,e=>{const p=Number(e?.currentPosition||0);setScTime(p,scDurationMs)});
    scWidget.bind(SC.Widget.Events.PLAY,()=>setScPlaying(true));
    scWidget.bind(SC.Widget.Events.PAUSE,()=>setScPlaying(false));
    scWidget.bind(SC.Widget.Events.FINISH,()=>{setScPlaying(false);setScTime(scDurationMs,scDurationMs)});
    scWidget.bind(SC.Widget.Events.ERROR,()=>{const st=document.getElementById('scPlaybackState');if(st)st.textContent='SOUNDCLOUD ERROR'});
  }catch(e){}
}
function executeScCommand(cmd,s){
  if(!cmd||!cmd.type||cmd.type==='none')return;
  if(!scWidget||!scReady){pendingScCommand=cmd;return}
  try{
    if(cmd.type==='play')scWidget.play();
    else if(cmd.type==='pause')scWidget.pause();
    else if(cmd.type==='restart'){scWidget.seekTo(0);scWidget.play()}
    else if(cmd.type==='stop'){scWidget.pause();scWidget.seekTo(0);setScTime(0,scDurationMs)}
    else if(cmd.type==='volume')scWidget.setVolume(Math.max(0,Math.min(100,Number(s.listening?.volume??82))))
  }catch(e){}
}
function handleScCommand(s){
  const cmd=s.listening?.playerCommand||{};
  const n=Number(cmd.nonce||0);
  if(n&&n!==lastScCommandNonce){lastScCommandNonce=n;executeScCommand(cmd,s)}
}
function afterSceneRender(s,sc){updateJudgeScores(s);if(sc==='listening')setupSoundCloud(s)}
function draw(s){state=s;document.getElementById('header').innerHTML=header(s);document.getElementById('foot').textContent=(s.eventTitle||'FREQ PRODUCER CHAMPIONSHIP')+' • '+(s.season||'SEASON 1');renderLowerThird(s);updateJudgeScores(s);const sc=s.scene||'full',sig=signature(s),node=document.getElementById('scene'),stage=document.getElementById('stage');stage.classList.toggle('introMode',sc==='intro');if(sc!==lastScene){
  node.classList.remove('scene-in','soft-refresh');node.classList.add('scene-out');
  setTimeout(()=>{node.innerHTML=sceneHTML(s,sc);node.classList.remove('scene-out');void node.offsetWidth;node.classList.add('scene-in');afterSceneRender(s,sc)},170);
  lastScene=sc;lastSignature=sig;
}else if(sig!==lastSignature){node.innerHTML=sceneHTML(s,sc);node.classList.remove('soft-refresh');void node.offsetWidth;node.classList.add('soft-refresh');lastSignature=sig;afterSceneRender(s,sc)}handleScCommand(s);const c=s.cue||{};if(Number(c.nonce||0)!==lastCue){lastCue=Number(c.nonce||0);if(c.type&&c.type!=='none')fire(c.type)}}
function fire(t){
  if(t==='audio_test_transition'||t==='audio_test_intro'||t==='intro_start')return;
  const map={round_start:['ROUND START','FREQ PRODUCER CHAMPIONSHIP'],contestant:['NEXT PRODUCER','NOW PLAYING'],scores_locked:['SCORES LOCKED','JUDGES HAVE SPOKEN'],timeup:["TIME'S UP",'LOCK YOUR PROJECT'],finals:['FINALS','THE LAST FLIP']},x=map[t]||[String(t).toUpperCase(),'FREQ'];
  document.getElementById('cueTitle').textContent=x[0];
  document.getElementById('cueSub').textContent=x[1];
  const n=document.getElementById('cue');n.classList.remove('go');void n.offsetWidth;n.classList.add('go')
}
function tick(){
  if(!state)return;
  document.querySelectorAll('[data-time]').forEach(n=>n.textContent=timer(state));
  document.querySelectorAll('[data-upnext]').forEach(n=>n.textContent=upTimer(state))
}
function scale(){const s=document.getElementById('stage'),k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='scale('+k+')'}
addEventListener('resize',scale);scale();
async function poll(){try{const r=await fetch(API,{cache:'no-store'}),d=await r.json();if(d.state)draw(d.state)}catch(e){}}
poll();setInterval(poll,900);setInterval(tick,200);
</script>
</body>
